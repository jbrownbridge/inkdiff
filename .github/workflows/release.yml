# Push a tag vX.Y.Z (matching manifest.json and package.json) to build, attest and publish a release.
# The build job runs the npm dependency tree with a read-only token; the publish job, which holds
# write permissions, runs no npm code at all.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag matches manifest.json and package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest=$(node -p "require('./public/manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$manifest" ] || [ "$TAG" != "v$pkg" ]; then
            echo "Tag $TAG does not match manifest.json ($manifest) and package.json ($pkg)."
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            inkdiff-*.zip
            dist/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: inkdiff-*.zip
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" inkdiff-*.zip dist/THIRD_PARTY_LICENSES.txt --repo "$REPO" --verify-tag --generate-notes --title "Inkdiff $TAG"
